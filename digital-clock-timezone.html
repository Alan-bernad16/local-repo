<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .clock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.6);
        }

        .clock-card.dark {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        .clock-card.warm {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .clock-card.cool {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .clock-card.sunset {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .city-name {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .timezone-info {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 15px;
        }

        .digital-time {
            font-size: 2.5em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .ampm {
            font-size: 1.1em;
            font-weight: 500;
        }

        .date-display {
            font-size: 0.9em;
            opacity: 0.9;
            margin-top: 10px;
        }

        .controls {
            text-align: center;
            margin-bottom: 30px;
        }

        .format-toggle {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .format-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        .format-toggle:active {
            transform: scale(0.98);
        }

        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 5px;
            color: #333;
            margin-top: 20px;
        }

        .info-box p {
            font-size: 0.95em;
            line-height: 1.6;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .digital-time {
                font-size: 2em;
            }

            .city-name {
                font-size: 1.1em;
            }
        }

        .blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% {
                opacity: 1;
            }
            50%, 100% {
                opacity: 0.3;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 Global Time Zone Clock</h1>
            <p>Current time around the world</p>
        </div>

        <div class="controls">
            <button class="format-toggle" onclick="toggleFormat()">
                Switch to <span id="format-text">24-Hour</span> Format
            </button>
        </div>

        <div class="clocks-grid" id="clocksContainer">
            <!-- Clocks will be inserted here by JavaScript -->
        </div>

        <div class="info-box">
            <p><strong>💡 Tip:</strong> Click the button above to switch between 12-hour (AM/PM) and 24-hour time formats. The clocks update every second to show real-time.</p>
        </div>
    </div>

    <script>
        let is24Hour = false;

        const timeZones = [
            { city: 'New York', timezone: 'America/New_York', color: 'dark' },
            { city: 'London', timezone: 'Europe/London', color: 'warm' },
            { city: 'Tokyo', timezone: 'Asia/Tokyo', color: 'cool' },
            { city: 'Sydney', timezone: 'Australia/Sydney', color: 'sunset' },
            { city: 'Dubai', timezone: 'Asia/Dubai', color: 'dark' },
            { city: 'Singapore', timezone: 'Asia/Singapore', color: 'warm' },
            { city: 'Los Angeles', timezone: 'America/Los_Angeles', color: 'cool' },
            { city: 'Berlin', timezone: 'Europe/Berlin', color: 'sunset' },
            { city: 'Hong Kong', timezone: 'Asia/Hong_Kong', color: 'dark' },
            { city: 'Toronto', timezone: 'America/Toronto', color: 'warm' },
            { city: 'São Paulo', timezone: 'America/Sao_Paulo', color: 'cool' },
            { city: 'Mumbai', timezone: 'Asia/Kolkata', color: 'sunset' }
        ];

        function formatTime(date, use24Hour) {
            if (use24Hour) {
                return date.toLocaleTimeString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                });
            } else {
                return date.toLocaleTimeString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                });
            }
        }

        function formatDate(date) {
            return date.toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        function getUTCOffset(timezone) {
            const date = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: timezone,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            
            const localTime = new Date(date.toLocaleString('en-US', { timeZone: 'UTC' }));
            const tzTime = new Date(date.toLocaleString('en-US', { timeZone: timezone }));
            const diff = (tzTime - localTime) / 3600000;
            
            const sign = diff >= 0 ? '+' : '-';
            const hours = Math.floor(Math.abs(diff));
            const minutes = Math.abs(diff % 1) * 60;
            
            return `UTC ${sign}${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
        }

        function initializeClock(timezone, city, colorClass) {
            const date = new Date();
            const time = date.toLocaleString('en-US', { timeZone: timezone });
            const tzDate = new Date(time);
            
            const timeString = formatTime(tzDate, is24Hour);
            const dateString = formatDate(tzDate);
            const offset = getUTCOffset(timezone);
            
            const ampmText = !is24Hour ? (tzDate.getHours() >= 12 ? 'PM' : 'AM') : '';

            return `
                <div class="clock-card ${colorClass}">
                    <div class="city-name">${city}</div>
                    <div class="timezone-info">${offset}</div>
                    <div class="digital-time">${timeString}</div>
                    ${!is24Hour ? `<div class="ampm">${ampmText}</div>` : ''}
                    <div class="date-display">${dateString}</div>
                </div>
            `;
        }

        function updateAllClocks() {
            const container = document.getElementById('clocksContainer');
            container.innerHTML = '';

            timeZones.forEach(({ city, timezone, color }) => {
                container.innerHTML += initializeClock(timezone, city, color);
            });
        }

        function toggleFormat() {
            is24Hour = !is24Hour;
            const button = document.querySelector('.format-toggle');
            button.textContent = `Switch to ${is24Hour ? '12-Hour' : '24-Hour'} Format`;
            updateAllClocks();
        }

        // Update clocks every second
        updateAllClocks();
        setInterval(updateAllClocks, 1000);

        // Update UTC offsets every minute
        setInterval(() => {
            updateAllClocks();
        }, 60000);
    </script>
</body>
</html>
